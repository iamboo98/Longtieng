services:
  - type: web
    name: longtieng-downloader
    runtime: docker
    rootDir: server
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: API_TOKEN
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://iamboo98.github.io
      - key: MAX_FILESIZE_MB
        value: "300"
      - key: MAX_DURATION_MIN
        value: "60"
      - key: GROQ_API_KEY
        sync: false
